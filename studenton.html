<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Quiz Portal</title>
  <style>
    /* Set the second image as the background wallpaper */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('image_99ee14.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #333;
    }

    .portal-container {
      max-width: 800px;
      margin: 50px auto;
      background: rgba(255, 255, 255, 0.92);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }

    .quiz-card {
      background: #ffffff;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      border-left: 5px solid #3498db;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quiz-info h3 {
      margin: 0 0 5px 0;
      color: #2c3e50;
    }

    .quiz-info p {
      margin: 0;
      font-size: 0.85rem;
      color: #7f8c8d;
    }

    .btn-take-quiz {
      background: #3498db;
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-take-quiz:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <h1>Available Quizzes</h1>
    <div id="quiz-list-container">
      <!-- Quizzes will be dynamically loaded here -->
    </div>
  </div>

  <script>
    function loadStudentQuizzes() {
      // Retrieve quizzes from localStorage (or adjust to your data source)
      let quizzes = JSON.parse(localStorage.getItem('uploadedQuizzes')) || [];

      // Automatically sort quizzes: newest upload date/time on top
      quizzes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      const container = document.getElementById('quiz-list-container');
      container.innerHTML = '';

      if (quizzes.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666;">No quizzes available at the moment.</p>';
        return;
      }

      quizzes.forEach(quiz => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        
        const uploadDate = quiz.createdAt ? new Date(quiz.createdAt).toLocaleString() : 'Recent';

        card.innerHTML = `
          <div class="quiz-info">
            <h3>${quiz.title || 'Untitled Quiz'}</h3>
            <p>Uploaded on: ${uploadDate}</p>
          </div>
          <a href="quiz.html?id=${quiz.id}" class="btn-take-quiz">Start Quiz</a>
        `;
        container.appendChild(card);
      });
    }

    // Run automatically when the page loads
    window.onload = loadStudentQuizzes;
  </script>
</body>
</html>
