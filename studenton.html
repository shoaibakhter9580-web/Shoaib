<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoaib Akhter — Student Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #ece2fb 0%, #f6f3fb 35%, #fbfafc 100%); color: #1e1b2e; min-height: 100vh; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
    .soft-card { background: #ffffff; border: 1px solid rgba(226, 220, 238, 0.75); box-shadow: 0 2px 10px rgba(118, 92, 168, 0.04); transition: all 0.2s ease; }
    .soft-card:hover { box-shadow: 0 6px 18px rgba(118, 92, 168, 0.08); transform: translateY(-1px); }
    .folder-card { background: #ffffff; border: 1px solid rgba(230, 226, 240, 0.85); box-shadow: 0 3px 12px rgba(120, 100, 160, 0.04); transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .folder-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(120, 100, 160, 0.09); border-color: #d8cde9; }
    .pill-active { background-color: #551a8b !important; color: #ffffff !important; }
  </style>
</head>
<body class="p-3 sm:p-6 lg:p-8 flex flex-col justify-between min-h-screen">
  <div class="max-w-5xl mx-auto w-full">
    <header class="flex items-center justify-between pb-6 border-b border-purple-100/70 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-purple-900 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-purple-900/10">
          S
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">Shoaib Akhter</h1>
          <p class="text-xs text-purple-700/80 font-medium">Ghazipur • Uttar Pradesh</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <div class="flex bg-slate-200/60 p-1 rounded-xl text-xs font-semibold text-slate-600">
          <button id="tabFilesBtn" onclick="switchPortalTab('files')" class="px-3.5 py-1.5 rounded-lg bg-white text-purple-900 shadow-sm transition">
            <i class="fa-regular fa-file-lines mr-1.5"></i> Files
          </button>
          <button id="tabFoldersBtn" onclick="switchPortalTab('folders')" class="px-3.5 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition">
            <i class="fa-regular fa-folder mr-1.5"></i> Folders
          </button>
        </div>

        <a href="adminlogin.html" class="px-3.5 py-2 rounded-xl bg-purple-100 hover:bg-purple-200 text-purple-900 border border-purple-200 text-xs font-semibold flex items-center gap-1.5 transition">
          <i class="fa-brands fa-telegram text-sm text-sky-600"></i>
          <span>Student Mode</span>
        </a>

        <a href="nitrence.html" title="Home" class="w-9 h-9 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 flex items-center justify-center transition">
          <i class="fa-solid fa-house text-xs"></i>
        </a>
      </div>
    </header>

    <section id="tabFilesContent" class="space-y-6">
      <div>
        <h2 class="text-2xl font-serif-title font-bold text-slate-900">Files</h2>
        <p class="text-xs text-slate-500 mt-0.5">Latest from class</p>
      </div>

      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input id="fileSearchInput" oninput="handleSearch()" type="text" placeholder="Search notes, tags, topics..." 
               class="w-full pl-10 pr-4 py-3 bg-white rounded-2xl border border-purple-100/70 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-400/30 shadow-sm" />
      </div>

      <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
        <button onclick="filterFiles('all', this)" class="filter-pill pill-active px-4 py-1.5 rounded-full font-semibold bg-white border border-slate-200/80 text-slate-600 transition">All</button>
        <button onclick="filterFiles('new', this)" class="filter-pill px-3.5 py-1.5 rounded-full font-medium bg-white border border-slate-200/80 text-slate-700 transition flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-emerald-100 text-emerald-700 text-[10px] flex items-center justify-center font-bold">📄</span>
          New <span id="badgeNewCount">• 0</span>
        </button>
        <button onclick="filterFiles('important', this)" class="filter-pill px-3.5 py-1.5 rounded-full font-medium bg-white border border-slate-200/80 text-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-star text-amber-400 text-[11px]"></i> Important
        </button>
        <button onclick="filterFiles('pdf', this)" class="filter-pill px-3.5 py-1.5 rounded-full font-medium bg-white border border-slate-200/80 text-slate-700 transition flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-xs bg-red-600 inline-block"></span> PDFs
        </button>
        <button onclick="filterFiles('image', this)" class="filter-pill px-3.5 py-1.5 rounded-full font-medium bg-white border border-slate-200/80 text-slate-700 transition flex items-center gap-1.5">
          <span>🖼️</span> Images
        </button>
        <button onclick="filterFiles('video', this)" class="filter-pill px-3.5 py-1.5 rounded-full font-medium bg-white border border-slate-200/80 text-slate-700 transition flex items-center gap-1.5">
          <span>🎬</span> Videos
        </button>
      </div>

      <div id="fileCardsContainer" class="space-y-6 pt-2"></div>
    </section>

    <section id="tabFoldersContent" class="space-y-6 hidden">
      <div>
        <h2 class="text-2xl font-serif-title font-bold text-slate-900">Folders</h2>
        <p class="text-xs text-slate-500 mt-0.5">Browse by folder</p>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5 pt-2">
        <div onclick="openFolder('SuperTET')" class="folder-card p-4 rounded-2xl cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-500 text-lg mb-3"><i class="fa-solid fa-folder"></i></div>
          <h4 class="font-bold text-xs sm:text-sm text-slate-800 mb-0.5">SuperTET</h4>
          <p id="cnt-SuperTET" class="text-[11px] text-slate-400">0 items</p>
        </div>
        <div onclick="openFolder('Cosmos')" class="folder-card p-4 rounded-2xl cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-sky-50 flex items-center justify-center text-sky-500 text-lg mb-3"><i class="fa-solid fa-folder"></i></div>
          <h4 class="font-bold text-xs sm:text-sm text-slate-800 mb-0.5">Cosmos</h4>
          <p id="cnt-Cosmos" class="text-[11px] text-slate-400">0 items</p>
        </div>
        <div onclick="openFolder('UPSSSC')" class="folder-card p-4 rounded-2xl cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center text-teal-500 text-lg mb-3"><i class="fa-solid fa-folder"></i></div>
          <h4 class="font-bold text-xs sm:text-sm text-slate-800 mb-0.5">UPSSSC</h4>
          <p id="cnt-UPSSSC" class="text-[11px] text-slate-400">0 items</p>
        </div>
        <div onclick="openFolder('Group D')" class="folder-card p-4 rounded-2xl cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-500 text-lg mb-3"><i class="fa-solid fa-folder"></i></div>
          <h4 class="font-bold text-xs sm:text-sm text-slate-800 mb-0.5">Group D</h4>
          <p id="cnt-GroupD" class="text-[11px] text-slate-400">0 items</p>
        </div>
        <div onclick="openFolder('NCERT')" class="folder-card p-4 rounded-2xl cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-yellow-50 flex items-center justify-center text-amber-500 text-lg mb-3"><i class="fa-solid fa-folder"></i></div>
          <h4 class="font-bold text-xs sm:text-sm text-slate-800 mb-0.5">NCERT</h4>
          <p id="cnt-NCERT" class="text-[11px] text-slate-400">0 items</p>
        </div>
        <div onclick="openFolder('Lekhpal')" class="folder-card p-4 rounded-2xl cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-rose-50 flex items-center justify-center text-rose-500 text-lg mb-3"><i class="fa-solid fa-folder"></i></div>
          <h4 class="font-bold text-xs sm:text-sm text-slate-800 mb-0.5">Lekhpal</h4>
          <p id="cnt-Lekhpal" class="text-[11px] text-slate-400">0 items</p>
        </div>
      </div>
    </section>
  </div>

  <footer class="max-w-5xl mx-auto w-full pt-10 pb-4 text-center text-xs text-slate-400">
    Shoaib Akhter • Ghazipur, Uttar Pradesh • Protected by Telegram Security Gateway
  </footer>

  <script>
    let db;
    let currentFilter = 'all';

    function initIndexedDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open("ShoaibPortalDB", 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains("filesStore")) {
            database.createObjectStore("filesStore", { keyPath: "id" });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = () => resolve(null);
      });
    }

    async function getAllFiles() {
      return new Promise((resolve) => {
        if (!db) return resolve([]);
        const tx = db.transaction("filesStore", "readonly");
        const store = tx.objectStore("filesStore");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function downloadFile(id) {
      const all = await getAllFiles();
      const item = all.find(f => f.id === id);
      if (!item || !item.blob) return alert("File not found.");

      const url = URL.createObjectURL(item.blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = item.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    async function renderFilesList(filter = currentFilter, searchQuery = '') {
      const container = document.getElementById("fileCardsContainer");
      container.innerHTML = "";
      const all = await getAllFiles();
      const query = (searchQuery || document.getElementById("fileSearchInput").value || "").toLowerCase();

      const matching = all.filter(f => {
        const matchesQuery = f.name.toLowerCase().includes(query) ||
                             (f.tag && f.tag.toLowerCase().includes(query)) ||
                             (f.folder && f.folder.toLowerCase().includes(query));
        if (!matchesQuery) return false;
        if (filter === 'all') return true;
        if (filter === 'new') return f.isNew;
        if (filter === 'important') return f.isImportant;
        if (filter === 'pdf') return f.type === 'pdf';
        if (filter === 'image') return f.type === 'image';
        if (filter === 'video') return f.type === 'video';
        return true;
      });

      document.getElementById("badgeNewCount").innerText = `• ${all.filter(f => f.isNew).length}`;

      if (matching.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center">
            <div class="w-12 h-12 rounded-2xl bg-purple-50 text-purple-400 mx-auto flex items-center justify-center text-xl mb-3">
              <i class="fa-regular fa-folder-open"></i>
            </div>
            <p class="text-sm font-semibold text-slate-700">No files uploaded yet</p>
            <p class="text-xs text-slate-400 mt-1 max-w-sm mx-auto">
              Files uploaded by management will appear here for download.
            </p>
          </div>
        `;
        return;
      }

      const secDiv = document.createElement("div");
      secDiv.className = "space-y-2.5";
      secDiv.innerHTML = `
        <div class="flex items-center gap-2 text-xs font-bold text-slate-800 uppercase tracking-wide">
          <span>PORTAL FILES</span>
          <span class="text-slate-400 font-semibold text-[11px]">${matching.length}</span>
        </div>
        <div class="space-y-2.5" id="fileItemsList"></div>
      `;
      container.appendChild(secDiv);
      const itemsList = secDiv.querySelector("#fileItemsList");

      matching.forEach(f => {
        const card = document.createElement("div");
        card.className = "soft-card p-3 sm:p-3.5 rounded-2xl flex items-center justify-between";

        let iconBox = `<div class="relative w-10 h-11 rounded-xl bg-rose-50 border border-rose-100 flex items-center justify-center flex-shrink-0"><div class="w-5 h-7 rounded-sm bg-rose-500 border border-rose-600 flex flex-col justify-center items-center text-white"><div class="w-3 h-0.5 bg-white/70 mb-1"></div><div class="w-3 h-0.5 bg-white/70"></div></div>${f.isNew ? '<div class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 rounded-full border border-white"></div>' : ''}</div>`;
        if (f.type === 'image') iconBox = `<div class="w-10 h-11 rounded-xl bg-teal-50 border border-teal-100 flex items-center justify-center text-teal-600 text-lg flex-shrink-0"><i class="fa-regular fa-image"></i></div>`;
        if (f.type === 'video') iconBox = `<div class="w-10 h-11 rounded-xl bg-purple-50 border border-purple-100 flex items-center justify-center text-purple-600 text-lg flex-shrink-0"><i class="fa-solid fa-play text-sm"></i></div>`;

        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            ${iconBox}
            <div class="truncate">
              <div class="flex items-center gap-2">
                ${f.isImportant ? '<i class="fa-solid fa-star text-amber-400 text-xs"></i>' : ''}
                <span class="text-xs sm:text-sm font-bold text-slate-900 truncate">${f.name}</span>
                ${f.isNew ? '<span class="text-[9px] font-bold px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded-md">NEW</span>' : ''}
              </div>
              <div class="flex items-center gap-2 text-[11px] text-slate-400 mt-0.5">
                ${f.folder ? `<span class="flex items-center gap-1 text-slate-500"><i class="fa-solid fa-folder text-amber-400 text-[10px]"></i> ${f.folder}</span>` : ''}
                <span>${f.size}</span>
                <span>•</span>
                <span>${f.time}</span>
                ${f.tag ? `<span class="text-purple-600 font-semibold">${f.tag}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 flex-shrink-0 ml-2">
            <button onclick="downloadFile('${f.id}')" title="Download" class="w-9 h-9 rounded-xl border border-slate-200/80 hover:bg-slate-100 text-slate-600 flex items-center justify-center transition">
              <i class="fa-solid fa-arrow-down text-xs"></i>
            </button>
          </div>
        `;
        itemsList.appendChild(card);
      });
    }

    async function refreshFolderCounts() {
      const all = await getAllFiles();
      const folders = ['SuperTET', 'Cosmos', 'UPSSSC', 'GroupD', 'NCERT', 'Lekhpal'];
      folders.forEach(f => {
        const key = f === 'GroupD' ? 'Group D' : f;
        const count = all.filter(item => item.folder === key).length;
        const el = document.getElementById(`cnt-${f}`);
        if (el) el.innerText = `${count} ${count === 1 ? 'item' : 'items'}`;
      });
    }

    function filterFiles(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("pill-active"));
      btn.classList.add("pill-active");
      renderFilesList(filter, document.getElementById("fileSearchInput").value);
    }

    function handleSearch() {
      renderFilesList(currentFilter, document.getElementById("fileSearchInput").value);
    }

    function switchPortalTab(tab) {
      const filesSec = document.getElementById("tabFilesContent");
      const foldersSec = document.getElementById("tabFoldersContent");
      const btnFiles = document.getElementById("tabFilesBtn");
      const btnFolders = document.getElementById("tabFoldersBtn");

      if (tab === 'files') {
        filesSec.classList.remove("hidden");
        foldersSec.classList.add("hidden");
        btnFiles.className = "px-3.5 py-1.5 rounded-lg bg-white text-purple-900 shadow-sm transition";
        btnFolders.className = "px-3.5 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition";
      } else {
        filesSec.classList.add("hidden");
        foldersSec.classList.remove("hidden");
        btnFolders.className = "px-3.5 py-1.5 rounded-lg bg-white text-purple-900 shadow-sm transition";
        btnFiles.className = "px-3.5 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition";
        refreshFolderCounts();
      }
    }

    function openFolder(name) {
      switchPortalTab('files');
      document.getElementById("fileSearchInput").value = name;
      renderFilesList('all', name);
    }

    initIndexedDB().then(() => {
      renderFilesList();
      refreshFolderCounts();
    });
  </script>
</body>
</html>
