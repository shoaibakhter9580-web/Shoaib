<script>
    let currentTab = 'files';
    let activeFilter = 'All';
    let dbInstance = null;
    let allFiles = [];
    let foldersList = [];

    // 1. Open IndexedDB without version lock (avoids VersionError)
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("ShoaibPortalDB");
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("files")) {
            db.createObjectStore("files", { keyPath: "id", autoIncrement: true });
          }
          if (!db.objectStoreNames.contains("folders")) {
            db.createObjectStore("folders", { keyPath: "id", autoIncrement: true });
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = (e) => {
          console.error("IndexedDB Open Failed:", e);
          reject(e);
        };
      });
    }

    // 2. Universal File Loader (reads from any store adminin wrote to)
    async function fetchFiles() {
      if (!dbInstance) return [];
      const storeNames = Array.from(dbInstance.objectStoreNames);
      const targetStore = storeNames.find(s => ['files', 'uploads', 'documents'].includes(s.toLowerCase())) || storeNames[0];

      if (!targetStore || targetStore.toLowerCase() === 'folders') return [];

      return new Promise((resolve) => {
        try {
          const tx = dbInstance.transaction([targetStore], "readonly");
          const store = tx.objectStore(targetStore);
          const req = store.getAll();
          req.onsuccess = () => {
            const rawFiles = req.result || [];
            // Normalize field names
            const normalized = rawFiles.map((f, index) => ({
              id: f.id !== undefined ? f.id : index,
              name: f.name || f.fileName || f.filename || "Untitled File",
              folder: f.folder || f.category || f.folderName || f.directory || "General",
              size: f.size || (f.blob ? f.blob.size : 0) || 0,
              date: f.date || f.uploadedAt || f.timestamp || "Recent",
              blob: f.blob || f.file || f.data
            }));
            resolve(normalized);
          };
          req.onerror = () => resolve([]);
        } catch (err) {
          console.error("Error reading file store:", err);
          resolve([]);
        }
      });
    }

    // 3. Universal Folder Loader (scans LocalStorage + IndexedDB)
    async function loadTaxonomies() {
      const detectedFolders = new Set();

      // A. Scan all LocalStorage entries
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        try {
          const parsed = JSON.parse(localStorage.getItem(key));
          if (Array.isArray(parsed)) {
            parsed.forEach(item => {
              if (typeof item === 'string' && item.trim()) detectedFolders.add(item.trim());
              if (typeof item === 'object' && item !== null) {
                const name = item.name || item.folder || item.title || item.folderName;
                if (name) detectedFolders.add(name.trim());
              }
            });
          }
        } catch (e) {}
      }

      // B. Scan IndexedDB for a dedicated 'folders' store
      if (dbInstance && dbInstance.objectStoreNames.contains("folders")) {
        try {
          const idbFolders = await new Promise(res => {
            const tx = dbInstance.transaction(["folders"], "readonly");
            const req = tx.objectStore("folders").getAll();
            req.onsuccess = () => res(req.result || []);
            req.onerror = () => res([]);
          });
          idbFolders.forEach(item => {
            if (typeof item === 'string') detectedFolders.add(item);
            if (typeof item === 'object' && item !== null) {
              const name = item.name || item.folder || item.title;
              if (name) detectedFolders.add(name);
            }
          });
        } catch (e) {}
      }

      // C. Infer folders from uploaded files if no explicit folder entry exists
      allFiles.forEach(f => {
        if (f.folder && f.folder !== 'General') detectedFolders.add(f.folder);
      });

      foldersList = Array.from(detectedFolders);
      console.log("[Portal Sync] Detected Folders:", foldersList);
      console.log("[Portal Sync] Detected Files:", allFiles);
    }

    // 4. Tab Navigation Switcher
    function switchTab(tab) {
      currentTab = tab;
      const navFiles = document.getElementById('navFiles');
      const navFolders = document.getElementById('navFolders');
      const filesContainer = document.getElementById('filesContainer');
      const foldersContainer = document.getElementById('foldersContainer');
      const chipsContainer = document.getElementById('chipsContainer');
      const viewTitle = document.getElementById('viewTitle');
      const viewSubtitle = document.getElementById('viewSubtitle');

      if (tab === 'files') {
        navFiles.classList.add('active');
        navFolders.classList.remove('active');
        filesContainer.style.display = 'grid';
        foldersContainer.style.display = 'none';
        chipsContainer.style.display = 'flex';
        viewTitle.textContent = "Latest Files";
        viewSubtitle.textContent = "Verified classroom modules, notes & study materials";
        renderFiles();
      } else {
        navFolders.classList.add('active');
        navFiles.classList.remove('active');
        filesContainer.style.display = 'none';
        foldersContainer.style.display = 'grid';
        chipsContainer.style.display = 'none';
        viewTitle.textContent = "Class Folders";
        viewSubtitle.textContent = "Organized repository categories";
        renderFolders();
      }
    }

    // 5. Category Chips Rendering
    function renderChips() {
      const container = document.getElementById('chipsContainer');
      const categories = ['All', ...foldersList];
      container.innerHTML = categories.map(cat => `
        <button class="chip ${cat === activeFilter ? 'active' : ''}" onclick="filterByChip('${cat}')">
          ${cat}
        </button>
      `).join('');
    }

    function filterByChip(cat) {
      activeFilter = cat;
      renderChips();
      renderFiles();
    }

    // 6. File Cards Rendering
    function renderFiles() {
      const container = document.getElementById('filesContainer');
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      const filtered = allFiles.filter(file => {
        const matchesCategory = (activeFilter === 'All') || (file.folder === activeFilter);
        const matchesSearch = file.name && file.name.toLowerCase().includes(search);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span>&#128196;</span>
            <h3>No files found</h3>
            <p>Admin has not uploaded documents for this selection yet.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(file => {
        const sizeFormatted = file.size ? (file.size / 1024 < 1024 ? (file.size / 1024).toFixed(1) + ' KB' : (file.size / (1024 * 1024)).toFixed(1) + ' MB') : 'Document';
        const dateFormatted = file.date || 'Recent';

        return `
          <div class="file-card">
            <div>
              <div class="file-top">
                <div class="file-badge-icon">&#128196;</div>
                <div class="file-info">
                  <div class="file-name" title="${file.name}">${file.name}</div>
                  <span class="file-tag">${file.folder}</span>
                </div>
              </div>
              <div class="file-meta">
                <span>${sizeFormatted}</span>
                <span>${dateFormatted}</span>
              </div>
            </div>
            <button class="btn-download" onclick="downloadFile(${file.id})">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Download
            </button>
          </div>
        `;
      }).join('');
    }

    // 7. Folders Grid Rendering
    function renderFolders() {
      const container = document.getElementById('foldersContainer');
      if (foldersList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span>&#128193;</span>
            <h3>No folders created</h3>
            <p>Admin has not added any class folders yet.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = foldersList.map(folderName => {
        const count = allFiles.filter(f => f.folder === folderName).length;
        return `
          <div class="folder-card" onclick="openFolder('${folderName}')">
            <div class="folder-icon">&#128193;</div>
            <div>
              <div class="folder-card-title">${folderName}</div>
              <div class="folder-card-count">${count} ${count === 1 ? 'file' : 'files'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openFolder(folderName) {
      activeFilter = folderName;
      switchTab('files');
    }

    function handleSearch() {
      if (currentTab === 'files') renderFiles();
    }

    // 8. Universal Download Trigger
    function downloadFile(fileId) {
      const file = allFiles.find(f => f.id === fileId);
      if (!file || !file.blob) return;

      const blob = file.blob instanceof Blob ? file.blob : new Blob([file.blob], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // 9. Cross-Tab Live Synchronization
    window.addEventListener('storage', async () => {
      await reloadAll();
    });

    async function reloadAll() {
      allFiles = await fetchFiles();
      await loadTaxonomies();
      renderChips();
      if (currentTab === 'folders') {
        renderFolders();
      } else {
        renderFiles();
      }
    }

    // 10. Bootstrap
    async function boot() {
      try {
        await initDB();
      } catch (err) {
        console.error("DB init failed:", err);
      }
      await reloadAll();
    }

    window.addEventListener('DOMContentLoaded', boot);
  </script>
