<script>
    let currentTab = 'files';
    let activeFilter = 'All';
    let dbInstance = null;
    let allFiles = [];
    let foldersList = [];

    // 1. Read the exact LocalStorage key from adminin
    function loadTaxonomies() {
      const raw = localStorage.getItem('shoaib_folders_list');
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          foldersList = Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          console.error("Error parsing shoaib_folders_list:", e);
          foldersList = [];
        }
      } else {
        foldersList = [];
      }
    }

    // 2. Open IndexedDB matching ShoaibPortalDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("ShoaibPortalDB");
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = (e) => {
          console.error("IndexedDB Open Error:", e);
          reject(e);
        };
      });
    }

    // 3. Read from 'filesStore'
    function fetchFiles() {
      return new Promise((resolve) => {
        if (!dbInstance || !dbInstance.objectStoreNames.contains("filesStore")) {
          return resolve([]);
        }
        try {
          const tx = dbInstance.transaction(["filesStore"], "readonly");
          const store = tx.objectStore("filesStore");
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        } catch (err) {
          console.error("Error reading filesStore:", err);
          resolve([]);
        }
      });
    }

    // 4. Tab Navigation Switcher
    function switchTab(tab) {
      currentTab = tab;
      const navFiles = document.getElementById('navFiles');
      const navFolders = document.getElementById('navFolders');
      const filesContainer = document.getElementById('filesContainer');
      const foldersContainer = document.getElementById('foldersContainer');
      const chipsContainer = document.getElementById('chipsContainer');
      const viewTitle = document.getElementById('viewTitle');
      const viewSubtitle = document.getElementById('viewSubtitle');

      if (tab === 'files') {
        navFiles.classList.add('active');
        navFolders.classList.remove('active');
        filesContainer.style.display = 'grid';
        foldersContainer.style.display = 'none';
        chipsContainer.style.display = 'flex';
        viewTitle.textContent = "Latest Files";
        viewSubtitle.textContent = "Verified classroom modules, notes & study materials";
        renderFiles();
      } else {
        navFolders.classList.add('active');
        navFiles.classList.remove('active');
        filesContainer.style.display = 'none';
        foldersContainer.style.display = 'grid';
        chipsContainer.style.display = 'none';
        viewTitle.textContent = "Class Folders";
        viewSubtitle.textContent = "Organized repository categories";
        renderFolders();
      }
    }

    // 5. Render Folder Filter Chips
    function renderChips() {
      const container = document.getElementById('chipsContainer');
      const categories = ['All', ...foldersList];
      container.innerHTML = categories.map(cat => `
        <button class="chip ${cat === activeFilter ? 'active' : ''}" onclick="filterByChip('${cat}')">
          ${cat}
        </button>
      `).join('');
    }

    function filterByChip(cat) {
      activeFilter = cat;
      renderChips();
      renderFiles();
    }

    // 6. Render Files Grid
    function renderFiles() {
      const container = document.getElementById('filesContainer');
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      const filtered = allFiles.filter(file => {
        const fileFolder = file.folder || 'General';
        const matchesCategory = (activeFilter === 'All') || (fileFolder === activeFilter);
        const fileName = (file.name || '').toLowerCase();
        const matchesSearch = fileName.includes(search);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span>&#128196;</span>
            <h3>No files found</h3>
            <p>Admin has not uploaded documents for this selection yet.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(file => {
        const sizeFormatted = typeof file.size === 'string' ? file.size : (file.size ? (file.size / 1024).toFixed(1) + ' KB' : 'Document');
        const dateFormatted = file.time || file.date || 'Recent';
        const folderTag = file.folder || 'General';
        const safeId = String(file.id).replace(/'/g, "\\'");

        return `
          <div class="file-card">
            <div>
              <div class="file-top">
                <div class="file-badge-icon">&#128196;</div>
                <div class="file-info">
                  <div class="file-name" title="${file.name}">${file.name}</div>
                  <span class="file-tag">${folderTag}</span>
                </div>
              </div>
              <div class="file-meta">
                <span>${sizeFormatted}</span>
                <span>${dateFormatted}</span>
              </div>
            </div>
            <button class="btn-download" onclick="downloadFile('${safeId}')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Download
            </button>
          </div>
        `;
      }).join('');
    }

    // 7. Render Folders Grid (Geography, hello, etc.)
    function renderFolders() {
      const container = document.getElementById('foldersContainer');
      if (foldersList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span>&#128193;</span>
            <h3>No folders created</h3>
            <p>Admin has not added any class folders yet.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = foldersList.map(folderName => {
        const count = allFiles.filter(f => (f.folder || 'General') === folderName).length;
        return `
          <div class="folder-card" onclick="openFolder('${folderName}')">
            <div class="folder-icon">&#128193;</div>
            <div>
              <div class="folder-card-title">${folderName}</div>
              <div class="folder-card-count">${count} ${count === 1 ? 'file' : 'files'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openFolder(folderName) {
      activeFilter = folderName;
      switchTab('files');
    }

    function handleSearch() {
      if (currentTab === 'files') renderFiles();
    }

    // 8. Download File Trigger
    function downloadFile(fileId) {
      const file = allFiles.find(f => String(f.id) === String(fileId));
      if (!file) return;

      const blobData = file.blob instanceof Blob ? file.blob : (file.data instanceof Blob ? file.data : new Blob([file.blob || file.data || ""], { type: "application/octet-stream" }));
      const url = URL.createObjectURL(blobData);
      const a = document.createElement("a");
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // 9. Cross-tab synchronization
    window.addEventListener('storage', async (e) => {
      if (e.key === 'shoaib_folders_list') {
        loadTaxonomies();
        renderChips();
        if (currentTab === 'folders') {
          renderFolders();
        } else {
          renderFiles();
        }
      }
    });

    // 10. Startup Lifecycle
    async function boot() {
      loadTaxonomies();
      renderChips();
      try {
        await initDB();
        allFiles = await fetchFiles();
      } catch (err) {
        console.error("Initialization error:", err);
      }
      if (currentTab === 'folders') {
        renderFolders();
      } else {
        renderFiles();
      }
    }

    window.addEventListener('DOMContentLoaded', boot);
  </script>
