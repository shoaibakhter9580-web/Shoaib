<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies & Entertainment — Shoaib Akhter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap');
    
    :root {
      --bg-sidebar: rgba(18, 7, 38, 0.88);
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-hover: rgba(255, 255, 255, 0.9);
      --accent-purple: #7c3aed;
      --accent-gold: #f59e0b;
      --text-main: #1e1b2e;
      --text-muted: #64748b;
      --text-sub: #551a8b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: url('image_99ee14.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Glossy Translucent Sidebar */
    .sidebar {
      width: 290px;
      min-width: 290px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.25rem;
      min-height: 100vh;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 2rem;
      padding-left: 0.25rem;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, #7c3aed 0%, #3b0764 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.4);
    }

    .brand-logo-letter {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.14em;
      margin-top: 3px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.85rem 1rem;
      border-radius: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      background: transparent;
      border: 1.5px solid transparent;
    }

    .nav-item.active {
      background: rgba(124, 58, 237, 0.4);
      border-color: rgba(245, 158, 11, 0.8);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .nav-item:not(.active):hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(168, 85, 247, 0.35);
    }

    .nav-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .nav-item.active .nav-icon-box {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-gold);
    }

    .nav-item:not(.active) .nav-icon-box {
      background: rgba(124, 58, 237, 0.18);
      border: 1px solid rgba(124, 58, 237, 0.3);
      color: #c4b5fd;
    }

    .nav-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.2;
    }

    .nav-item.active .nav-sub { color: #fde68a; }

    .nav-sub {
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .sidebar-footer {
      margin-top: auto;
      text-align: center;
      padding-top: 2rem;
    }

    .btn-signout {
      color: #fca5a5;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-block;
      transition: opacity 0.2s ease;
    }

    .btn-signout:hover { opacity: 0.8; }

    /* Ultra-Glossy Translucent Main Content */
    .main-wrapper {
      flex: 1;
      padding: 2.25rem 2.5rem;
      max-width: 1200px;
      background: rgba(4, 15, 33, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      min-height: 100vh;
    }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .view-heading h2 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .view-heading p {
      color: #cbd5e1;
      font-size: 0.88rem;
      margin-top: 0.3rem;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: #cbd5e1;
      grid-column: 1 / -1;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Movies Layout CSS */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .movie-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(118, 92, 168, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.95);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .movie-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(192, 132, 252, 0.7);
      box-shadow: 0 14px 32px rgba(118, 92, 168, 0.2), inset 0 1px 2px #ffffff;
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: rgba(15, 23, 42, 0.45);
    }

    .movie-info {
      padding: 1rem;
      text-align: center;
    }

    .movie-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 820px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%;
        min-width: 100%;
        min-height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }
      .main-wrapper { padding: 1.5rem; }
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="brand-header">
      <div class="brand-logo">
        <span class="brand-logo-letter">S</span>
      </div>
      <div>
        <div class="brand-title">Shoaib Akhter</div>
        <div class="brand-subtitle">STUDENT</div>
      </div>
    </div>

    <ul class="nav-list">
      <li class="nav-item" onclick="window.location.href='studenton.html'">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </div>
        <div>
          <div class="nav-title">Files</div>
          <div class="nav-sub">Latest general notes</div>
        </div>
      </li>

      <li class="nav-item" onclick="window.location.href='studenton.html'">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div>
          <div class="nav-title">Folders</div>
          <div class="nav-sub">Browse by folder</div>
        </div>
      </li>

      <li class="nav-item" onclick="window.location.href='quiz.html'">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div>
          <div class="nav-title">Quiz</div>
          <div class="nav-sub">Classroom tests</div>
        </div>
      </li>

      <!-- MOVIES TAB IS ACTIVE HERE -->
      <li class="nav-item active">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
        </div>
        <div>
          <div class="nav-title">Movies</div>
          <div class="nav-sub">Stream & Relax</div>
        </div>
      </li>
    </ul>

    <div class="sidebar-footer">
      <a href="nitrence.html" class="btn-signout">Sign out</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-wrapper relative">
    <div class="header-bar mb-8">
      <div class="view-heading">
        <h2 id="viewTitle">Movies & Entertainment</h2>
        <p id="viewSubtitle">Stream popular movies directly from the portal.</p>
      </div>
    </div>

    <!-- Movies Grid Container -->
    <div id="moviesContainer" class="movie-grid">
      <div class="empty-state text-white col-span-full">
        Loading Movies...
      </div>
    </div>
  </main>

  <!-- CodeSpecters Video Player Modal -->
  <div id="movieStreamModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md hidden transition-opacity">
    <div class="relative w-full max-w-5xl h-[85vh] mx-4 bg-slate-900 rounded-3xl border border-white/20 shadow-2xl overflow-hidden flex flex-col">
      <div class="absolute top-4 right-4 z-10">
        <button onclick="closeMovieStream()" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/25 text-white flex items-center justify-center backdrop-blur-md transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="w-full h-full p-1 pt-12 sm:p-2 sm:pt-14">
        <iframe id="movieStreamIframe" class="w-full h-full rounded-2xl bg-black" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // --- API Configuration ---
    const APIFY_TOKEN = "apify_api_XO7cRvbLotd7OOy54EoeyTTGF2plmr42LpGM";
    const APIFY_DATASET_ID = "YOUR_DATASET_ID"; // IMPORTANT: Replace this with the actual dataset ID generated by your Apify Actor run
    const CODESPECTERS_API = "DEMO_36cc7cd2";

    window.addEventListener('DOMContentLoaded', fetchAndRenderMovies);

    async function fetchAndRenderMovies() {
      const container = document.getElementById('moviesContainer');
      let movies = [];

      try {
        // Attempt to pull data from your Apify Actor dataset
        const response = await fetch(`https://api.apify.com/v2/datasets/${APIFY_DATASET_ID}/items?token=${APIFY_TOKEN}`);
        if (response.ok) {
          movies = await response.json();
        } else {
          // If the dataset ID isn't set up yet, fallback to a local list so the UI doesn't break
          throw new Error("Apify Dataset missing or invalid. Loading fallback movies.");
        }
      } catch (error) {
        console.warn(error.message);
        
        // Fallback list of movies using correct TMDB IDs to ensure CodeSpecters API works instantly
        movies = [
          { tmdb_id: 597, title: "Titanic", poster_path: "https://image.tmdb.org/t/p/w500/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg" },
          { tmdb_id: 157336, title: "Interstellar", poster_path: "https://image.tmdb.org/t/p/w500/gEU2QlsUUHXjNpe412CzwcQl5n.jpg" },
          { tmdb_id: 27205, title: "Inception", poster_path: "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg" },
          { tmdb_id: 299534, title: "Avengers: Endgame", poster_path: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg" },
          { tmdb_id: 634649, title: "Spider-Man: No Way Home", poster_path: "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1R80vFAe2vC12k.jpg" },
          { tmdb_id: 155, title: "The Dark Knight", poster_path: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg" },
          { tmdb_id: 76341, title: "Mad Max: Fury Road", poster_path: "https://image.tmdb.org/t/p/w500/8tZYtuWezp8JbcsvHYO0O46tFbo.jpg" },
          { tmdb_id: 11, title: "Star Wars: Episode IV", poster_path: "https://image.tmdb.org/t/p/w500/6FfCtSchYvwP6121JIcaAKUaN6O.jpg" }
        ];
      }

      // Render the movie cards
      container.innerHTML = movies.map(movie => {
        // Ensure compatibility depending on how the Apify data is formatted vs the fallback format
        const id = movie.tmdb_id || movie.id;
        const poster = movie.poster_path || movie.poster;
        
        return `
          <div class="movie-card" onclick="openMovieStream(${id})">
            <img src="${poster}" alt="${movie.title}" class="movie-poster" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'">
            <div class="movie-info">
              <div class="movie-title" title="${movie.title}">${movie.title}</div>
              <div class="text-[10px] text-purple-600 font-bold mt-1 tracking-wider">STREAM NOW <i class="fa-solid fa-play ml-1"></i></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openMovieStream(tmdbId) {
      if (!tmdbId) return alert("Movie ID missing.");
      
      const modal = document.getElementById('movieStreamModal');
      const iframe = document.getElementById('movieStreamIframe');
      
      // Inject the TMDb ID into the CodeSpecters Stream API
      iframe.src = `https://api.codespecters.com/embed/movie/${tmdbId}?apikey=${CODESPECTERS_API}`;
      modal.classList.remove('hidden');
    }

    function closeMovieStream() {
      const modal = document.getElementById('movieStreamModal');
      const iframe = document.getElementById('movieStreamIframe');
      
      modal.classList.add('hidden');
      iframe.src = ""; // Clear the iframe source so audio stops playing in the background
    }
  </script>
</body>
</html>
