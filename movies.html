<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies & Entertainment — Shoaib Akhter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap');
    
    :root {
      --bg-sidebar: rgba(18, 7, 38, 0.88);
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-hover: rgba(255, 255, 255, 0.9);
      --accent-purple: #7c3aed;
      --accent-gold: #f59e0b;
      --text-main: #1e1b2e;
      --text-muted: #64748b;
      --text-sub: #551a8b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: url('image_99ee14.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Glossy Translucent Sidebar */
    .sidebar {
      width: 290px;
      min-width: 290px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.25rem;
      min-height: 100vh;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 2rem;
      padding-left: 0.25rem;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, #7c3aed 0%, #3b0764 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.4);
    }

    .brand-logo-letter {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.14em;
      margin-top: 3px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.85rem 1rem;
      border-radius: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      background: transparent;
      border: 1.5px solid transparent;
    }

    .nav-item.active {
      background: rgba(124, 58, 237, 0.4);
      border-color: rgba(245, 158, 11, 0.8);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .nav-item:not(.active):hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(168, 85, 247, 0.35);
    }

    .nav-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .nav-item.active .nav-icon-box {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-gold);
    }

    .nav-item:not(.active) .nav-icon-box {
      background: rgba(124, 58, 237, 0.18);
      border: 1px solid rgba(124, 58, 237, 0.3);
      color: #c4b5fd;
    }

    .nav-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.2;
    }

    .nav-item.active .nav-sub { color: #fde68a; }

    .nav-sub {
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .sidebar-footer {
      margin-top: auto;
      text-align: center;
      padding-top: 2rem;
    }

    .btn-signout {
      color: #fca5a5;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-block;
      transition: opacity 0.2s ease;
    }

    .btn-signout:hover { opacity: 0.8; }

    /* Ultra-Glossy Translucent Main Content */
    .main-wrapper {
      flex: 1;
      padding: 2.25rem 2.5rem;
      max-width: 1200px;
      background: rgba(4, 15, 33, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      min-height: 100vh;
    }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .view-heading h2 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .view-heading p {
      color: #cbd5e1;
      font-size: 0.88rem;
      margin-top: 0.3rem;
      font-weight: 500;
    }

    /* Search Bar Style */
    .search-container {
      position: relative;
      min-width: 280px;
      flex: 0 1 360px;
    }

    .search-container input {
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 0.8rem 1rem 0.8rem 2.6rem;
      color: #0f172a;
      font-size: 0.9rem;
      outline: none;
      box-shadow: 0 4px 20px rgba(118, 92, 168, 0.08);
      transition: all 0.25s ease;
    }

    .search-container input:focus {
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 24px rgba(124, 58, 237, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 0.95rem;
      top: 50%;
      transform: translateY(-50%);
      color: #7c3aed;
      font-size: 0.95rem;
    }

    /* Movies Layout */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1.5rem;
    }

    .movie-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(118, 92, 168, 0.08);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(192, 132, 252, 0.8);
      box-shadow: 0 16px 36px rgba(118, 92, 168, 0.25);
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: rgba(15, 23, 42, 0.6);
    }

    .movie-info {
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .movie-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
    }

    .movie-rating {
      color: #d97706;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: #cbd5e1;
      grid-column: 1 / -1;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    @media (max-width: 820px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%;
        min-width: 100%;
        min-height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }
      .main-wrapper { padding: 1.5rem; }
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="brand-header">
      <div class="brand-logo">
        <span class="brand-logo-letter">S</span>
      </div>
      <div>
        <div class="brand-title">Shoaib Akhter</div>
        <div class="brand-subtitle">STUDENT</div>
      </div>
    </div>

    <ul class="nav-list">
      <li class="nav-item" onclick="window.location.href='studenton.html'">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>

          </svg>

        <div>
          <div class="nav-title">Files</div>

        </div>
      </li>

      <li class="nav-item" onclick="window.location.href='studenton.html'">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>

          <div class="nav-title">Folders</div>

      <li class="nav-item" onclick="window.location.href='quiz.html'">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>

        </div>

    <div class="sidebar-footer">
      <a href="nitrence.html" class="btn-signout">Sign out</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-wrapper relative">
    <div class="header-bar">
      <div class="view-heading">
        <h2 id="viewTitle">Movies Directory</h2>
        <p id="viewSubtitle">Explore trending titles and search via The Movie Database (TMDB)</p>
      </div>

      <!-- Live Search Box -->
      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input 
          type="text" 
          id="movieSearchInput" 
          placeholder="Search any movie..." 
          oninput="handleMovieSearch()"
        />
      </div>
    </div>

    <!-- Movies Grid Container -->
    <div id="moviesContainer" class="movie-grid">
      <div class="empty-state text-white col-span-full">
        Loading movies catalog...
      </div>
    </div>
  </main>

  <!-- Movie Details Modal -->
  <div id="movieDetailsModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4">
    <div class="relative w-full max-w-2xl bg-slate-900 border border-purple-500/30 rounded-3xl p-6 sm:p-8 text-white shadow-2xl overflow-hidden">
      <button onclick="closeMovieModal()" class="absolute top-5 right-5 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start">
        <img id="modalPoster" src="" alt="Poster" class="w-44 rounded-2xl shadow-lg border border-white/10 object-cover flex-shrink-0">
        <div class="space-y-3">
          <h3 id="modalTitle" class="text-2xl font-bold text-white"></h3>
          <div class="flex items-center gap-3 text-xs font-semibold text-slate-300">
            <span id="modalDate" class="bg-purple-900/60 px-2.5 py-1 rounded-md border border-purple-500/40"></span>
            <span id="modalRating" class="text-amber-400 flex items-center gap-1"></span>
          </div>
          <p id="modalOverview" class="text-sm text-slate-300 leading-relaxed max-h-48 overflow-y-auto pr-2"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // TMDB API Configuration (Yahan apni free TMDB API key paste karein)
    const TMDB_API_KEY = "YOUR_TMDB_API_KEY"; 
    const TMDB_IMAGE_BASE = "https://image.tmdb.org/t/p/w500";
    let searchTimeout = null;

    // Fallback movies agar API key configure na ho ya internet slow ho
    const FALLBACK_MOVIES = [
      { id: 597, title: "Titanic", release_date: "1997-11-18", vote_average: 7.9, overview: "84 years later, a 101-year-old woman named Rose DeWitt Bukater tells the story to her granddaughter.", poster_path: "/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg" },
      { id: 157336, title: "Interstellar", release_date: "2014-11-05", vote_average: 8.4, overview: "The adventures of a group of explorers who make use of a newly discovered wormhole.", poster_path: "/gEU2QlsUUHXjNpe412CzwcQl5n.jpg" },
      { id: 27205, title: "Inception", release_date: "2010-07-15", vote_average: 8.4, overview: "Cobb, a skilled thief who steals secrets from deep within the subconscious during the dream state.", poster_path: "/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg" },
      { id: 299534, title: "Avengers: Endgame", release_date: "2019-04-24", vote_average: 8.3, overview: "After the devastating events of Avengers: Infinity War, the universe is in ruins.", poster_path: "/or06FN3Dka5tukK1e9sl16pB3iy.jpg" },
      { id: 634649, title: "Spider-Man: No Way Home", release_date: "2021-12-15", vote_average: 8.0, overview: "Peter Parker is unmasked and no longer able to separate his normal life from being a Super Hero.", poster_path: "/1g0dhYtq4irTY1R80vFAe2vC12k.jpg" },
      { id: 155, title: "The Dark Knight", release_date: "2008-07-16", vote_average: 8.5, overview: "Batman raises the stakes in his war on crime with the help of Lt. Jim Gordon and District Attorney Harvey Dent.", poster_path: "/qJ2tW6WMUDux911r6m7haRef0WH.jpg" }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      fetchTrendingMovies();
    });

    async function fetchTrendingMovies() {
      const container = document.getElementById('moviesContainer');
      if (!TMDB_API_KEY || TMDB_API_KEY === "YOUR_TMDB_API_KEY") {
        renderMovies(FALLBACK_MOVIES);
        return;
      }

      try {
        const response = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}`);
        if (!response.ok) throw new Error("TMDB request failed");
        const data = await response.json();
        renderMovies(data.results || []);
      } catch (err) {
        console.warn("Falling back to predefined movies list:", err.message);
        renderMovies(FALLBACK_MOVIES);
      }
    }

    function handleMovieSearch() {
      clearTimeout(searchTimeout);
      const query = document.getElementById('movieSearchInput').value.trim();

      searchTimeout = setTimeout(async () => {
        if (!query) {
          fetchTrendingMovies();
          return;
        }

        if (!TMDB_API_KEY || TMDB_API_KEY === "YOUR_TMDB_API_KEY") {
          const filtered = FALLBACK_MOVIES.filter(m => m.title.toLowerCase().includes(query.toLowerCase()));
          renderMovies(filtered);
          return;
        }

        try {
          const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
          if (!response.ok) throw new Error("Search request failed");
          const data = await response.json();
          renderMovies(data.results || []);
        } catch (err) {
          console.error("Search error:", err);
        }
      }, 350);
    }

    function renderMovies(movies) {
      const container = document.getElementById('moviesContainer');

      if (!movies || movies.length === 0) {
        container.innerHTML = `
          <div class="empty-state text-white col-span-full">
            <i class="fa-solid fa-film text-3xl mb-2 text-purple-400"></i>
            <p class="font-bold">Koi movie nahi mili.</p>
            <span class="text-xs text-slate-400">Dusra naam search karke dekhein.</span>
          </div>
        `;
        return;
      }

      container.innerHTML = movies.map(movie => {
        const posterUrl = movie.poster_path 
          ? (movie.poster_path.startsWith('http') ? movie.poster_path : `${TMDB_IMAGE_BASE}${movie.poster_path}`)
          : 'https://via.placeholder.com/500x750?text=No+Poster';

        const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
        const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'NR';
        const safeData = encodeURIComponent(JSON.stringify(movie));

        return `
          <div class="movie-card" onclick="openMovieModal('${safeData}')">
            <img src="${posterUrl}" alt="${movie.title}" class="movie-poster" loading="lazy">
            <div class="movie-info">
              <div class="movie-title" title="${movie.title}">${movie.title}</div>
              <div class="movie-meta">
                <span>${releaseYear}</span>
                <span class="movie-rating"><i class="fa-solid fa-star text-[10px]"></i> ${rating}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openMovieModal(encodedData) {
      const movie = JSON.parse(decodeURIComponent(encodedData));
      const modal = document.getElementById('movieDetailsModal');
      
      const posterUrl = movie.poster_path 
        ? (movie.poster_path.startsWith('http') ? movie.poster_path : `${TMDB_IMAGE_BASE}${movie.poster_path}`)
        : 'https://via.placeholder.com/500x750?text=No+Poster';

      document.getElementById('modalPoster').src = posterUrl;
      document.getElementById('modalTitle').textContent = movie.title;
      document.getElementById('modalDate').textContent = movie.release_date || "Release date unknown";
      document.getElementById('modalRating').innerHTML = `<i class="fa-solid fa-star"></i> ${movie.vote_average ? movie.vote_average.toFixed(1) : 'NR'} / 10`;
      document.getElementById('modalOverview').textContent = movie.overview || "Overview uplabdh nahi hai.";

      modal.classList.remove('hidden');
    }

    function closeMovieModal() {
      document.getElementById('movieDetailsModal').classList.add('hidden');
    }
  </script>
</body>
