<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream & Download Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 {
            color: #00adb5;
        }

        .input-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="url"] {
            flex-grow: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: white;
            font-size: 1rem;
        }

        button {
            padding: 12px 20px;
            background-color: #00adb5;
            color: #121212;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #007f86;
        }

        .player-container {
            width: 100%;
            max-width: 800px;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; /* Hidden until a link is loaded */
            flex-direction: column;
            align-items: center;
        }

        video {
            width: 100%;
            border-radius: 5px;
            background-color: #000;
            margin-bottom: 20px;
        }

        .download-btn {
            background-color: #e84545;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #b83333;
        }
        
        .error-message {
            color: #e84545;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Media Streamer</h1>
    <p>Paste a direct video link (e.g., ending in .mp4) to stream or download.</p>

    <div class="input-container">
        <input type="url" id="videoUrl" placeholder="https://example.com/movie.mp4" required>
        <button onclick="loadVideo()">Load Video</button>
    </div>
    
    <div id="errorMsg" class="error-message">Please enter a valid URL.</div>

    <div class="player-container" id="playerContainer">
        <video id="videoPlayer" controls>
            <source id="videoSource" src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <a href="#" id="downloadLink" class="download-btn" download>Download Video</a>
    </div>

    <script>
        function loadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const playerContainer = document.getElementById('playerContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoSource = document.getElementById('videoSource');
            const downloadLink = document.getElementById('downloadLink');
            const errorMsg = document.getElementById('errorMsg');

            if (!urlInput || !urlInput.startsWith('http')) {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';

            // Set the video source to the pasted link
            videoSource.src = urlInput;
            
            // Reload the player to recognize the new source
            videoPlayer.load();
            
            // Set the download button link
            downloadLink.href = urlInput;
            
            // Extract a filename from the URL for the download attribute, if possible
            const filename = urlInput.substring(urlInput.lastIndexOf('/') + 1) || "download.mp4";
            downloadLink.setAttribute('download', filename);

            // Show the player
            playerContainer.style.display = 'flex';
        }
    </script>
</body>
</html>
