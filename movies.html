<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies & Entertainment — Shoaib Akhter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap');
    
    :root {
      --bg-sidebar: rgba(18, 7, 38, 0.88);
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-hover: rgba(255, 255, 255, 0.9);
      --accent-purple: #7c3aed;
      --accent-gold: #f59e0b;
      --text-main: #1e1b2e;
      --text-muted: #64748b;
      --text-sub: #551a8b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: url('image_99ee14.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* Glossy Translucent Sidebar */
    .sidebar {
      width: 290px;
      min-width: 290px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.25rem;
      min-height: 100vh;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 2rem;
      padding-left: 0.25rem;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, #7c3aed 0%, #3b0764 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.4);
    }

    .brand-logo-letter {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.14em;
      margin-top: 3px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      list-style: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.85rem 1rem;
      border-radius: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      background: transparent;
      border: 1.5px solid transparent;
    }

    .nav-item.active {
      background: rgba(124, 58, 237, 0.4);
      border-color: rgba(245, 158, 11, 0.8);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .nav-item:not(.active):hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(168, 85, 247, 0.35);
    }

    .nav-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .nav-item.active .nav-icon-box {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-gold);
    }

    .nav-item:not(.active) .nav-icon-box {
      background: rgba(124, 58, 237, 0.18);
      border: 1px solid rgba(124, 58, 237, 0.3);
      color: #c4b5fd;
    }

    .nav-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.2;
    }

    .nav-item.active .nav-sub { color: #fde68a; }

    .nav-sub {
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .sidebar-footer {
      margin-top: auto;
      text-align: center;
      padding-top: 2rem;
    }

    .btn-signout {
      color: #fca5a5;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-block;
      transition: opacity 0.2s ease;
    }

    .btn-signout:hover { opacity: 0.8; }

    /* Main Content */
    .main-wrapper {
      flex: 1;
      padding: 2.25rem 2.5rem;
      max-width: 1200px;
      background: rgba(4, 15, 33, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      min-height: 100vh;
    }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .view-heading h2 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .view-heading p {
      color: #cbd5e1;
      font-size: 0.88rem;
      margin-top: 0.3rem;
      font-weight: 500;
    }

    .search-box {
      position: relative;
      min-width: 280px;
      flex: 0 1 340px;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 0.8rem 1rem 0.8rem 2.6rem;
      color: #0f172a;
      font-size: 0.9rem;
      outline: none;
      box-shadow: 0 4px 20px rgba(118, 92, 168, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.9);
      transition: all 0.25s ease;
    }

    .search-box input:focus {
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 24px rgba(124, 58, 237, 0.12), inset 0 1px 2px #ffffff;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: #cbd5e1;
      grid-column: 1 / -1;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Movies Layout CSS */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .movie-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(118, 92, 168, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.95);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .movie-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(192, 132, 252, 0.7);
      box-shadow: 0 14px 32px rgba(118, 92, 168, 0.2), inset 0 1px 2px #ffffff;
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: rgba(15, 23, 42, 0.45);
    }

    .movie-info {
      padding: 1rem;
      text-align: center;
    }

    .movie-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .movie-year {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    @media (max-width: 820px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%;
        min-width: 100%;
        min-height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }
      .main-wrapper { padding: 1.5rem; }
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="brand-header">
      <div class="brand-logo">
        <span class="brand-logo-letter">S</span>
      </div>
      <div>
        <div class="brand-title">Shoaib Akhter</div>
        <div class="brand-subtitle">STUDENT</div>
      </div>
    </div>

    <ul class="nav-list">
      <li class="nav-item" onclick="window.location.href='studenton.html'">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </div>
        <div>
          <div class="nav-title">Files</div>
          <div class="nav-sub">Latest general notes</div>
        </div>
      </li>

      <li class="nav-item" onclick="window.location.href='studenton.html'">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div>
          <div class="nav-title">Folders</div>
          <div class="nav-sub">Browse by folder</div>
        </div>
      </li>

      <li class="nav-item" onclick="window.location.href='quiz.html'">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div>
          <div class="nav-title">Quiz</div>
          <div class="nav-sub">Classroom tests</div>
        </div>
      </li>

      <!-- MOVIES TAB IS ACTIVE HERE -->
      <li class="nav-item active">
        <div class="nav-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
        </div>
        <div>
          <div class="nav-title">Movies</div>
          <div class="nav-sub">Search & Discover</div>
        </div>
      </li>
    </ul>

    <div class="sidebar-footer">
      <a href="nitrence.html" class="btn-signout">Sign out</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-wrapper relative">
    <div class="header-bar mb-8">
      <div class="view-heading">
        <h2 id="viewTitle">Movies & Entertainment</h2>
        <p id="viewSubtitle">Search for movies and see details.</p>
      </div>

      <div class="search-box">
        <!-- Search icon -->
        <svg viewBox="0 0 24 24" style="position: absolute; left: 0.95rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: #7c3aed; z-index: 1;">
          <path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"/>
        </svg>
        <!-- The ID allows the JS below to capture the enter key -->
        <input type="text" id="movieSearchInput" placeholder="Search for a movie..." onkeyup="handleSearchInput(event)">
      </div>
    </div>

    <!-- Movies Grid Container -->
    <div id="moviesContainer" class="movie-grid">
      <div class="empty-state text-white col-span-full">
        Search for a movie above to get started.
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // API CONFIGURATION
    // ==========================================
   const API_KEY = "4ac83cb7"; 
    const BASE_API_URL = "https://www.omdbapi.com/?apikey=" + API_KEY + "&s=";

    function handleSearchInput(event) {
      if (event.key === 'Enter') {
        const query = document.getElementById('movieSearchInput').value.trim();
        if (query) {
          fetchMovies(query);
        }
      }
    }

    async function fetchMovies(searchQuery) {
      const container = document.getElementById('moviesContainer');
      
      // Show loading state
      container.innerHTML = `<div class="empty-state text-white col-span-full">Loading...</div>`;

      try {
        const url = `${BASE_API_URL}${encodeURIComponent(searchQuery)}`;
        const response = await fetch(url);
        const data = await response.json();

        // OMDb returns Response: "False" if no movie matches the search
        if (data.Response === "False") {
          container.innerHTML = `<div class="empty-state text-white col-span-full">${data.Error}</div>`;
          return;
        }

        const moviesList = data.Search; 

        if (moviesList && moviesList.length > 0) {
          renderMovies(moviesList);
        } else {
          container.innerHTML = `<div class="empty-state text-white col-span-full">No movies found for "${searchQuery}".</div>`;
        }
      } catch (error) {
        console.error("API Fetch Error:", error);
        container.innerHTML = `<div class="empty-state text-white col-span-full text-red-300">Error connecting to the API. Check console.</div>`;
      }
    }

    function renderMovies(movies) {
      const container = document.getElementById('moviesContainer');
      
      container.innerHTML = movies.map(movie => {
        const title = movie.Title || "Unknown Title";
        const year = movie.Year || "";
        const poster = movie.Poster && movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/300x450?text=No+Poster';
        const imdbId = movie.imdbID || "";

        return `
          <div class="movie-card" onclick="window.open('https://www.imdb.com/title/${imdbId}', '_blank')">
            <img src="${poster}" alt="${title}" class="movie-poster" loading="lazy">
            <div class="movie-info">
              <div class="movie-title" title="${title}">${title}</div>
              <div class="movie-year">${year}</div>
              <div style="font-size: 0.75rem; color: #7c3aed; margin-top: 0.5rem; font-weight: bold;">View on IMDb ↗</div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
