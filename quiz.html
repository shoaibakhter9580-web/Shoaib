<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoaib Akhter — Student Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090514;
      --sidebar-bg: #0f0a1c;
      --card-bg: #160f27;
      --border: #281a42;
      --accent: #9333ea;
      --accent-light: #c084fc;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
    
    .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .brand-icon { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, #ec4899); display: flex; align-items: center; justify-content: center; font-weight: bold; }
    
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: var(--muted); text-decoration: none; margin-bottom: 6px; font-size: 14px; }
    .nav-link:hover, .nav-link.active { background: #1c1133; color: #fff; border: 1px solid #7c3aed; }
    
    .content { flex: 1; padding: 40px; max-width: 900px; margin: 0 auto; }
    .quiz-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 30px; margin-top: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    
    .options-list { display: flex; flex-direction: column; gap: 12px; margin: 24px 0; }
    .option-btn { background: #1c1333; border: 1px solid var(--border); padding: 14px 18px; border-radius: 12px; color: var(--text); text-align: left; cursor: pointer; transition: 0.2s; font-size: 15px; }
    .option-btn:hover:not(:disabled) { border-color: var(--accent-light); background: #261945; }
    .option-btn.correct { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--success) !important; color: #34d399 !important; }
    .option-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: #f87171 !important; }
    
    .primary-btn { background: linear-gradient(135deg, #9333ea, #a855f7); color: white; border: none; padding: 10px 22px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Sidebar Matching studenton.html -->
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon">S</div>
        <div>
          <div style="font-weight:700; font-size:14px;">Shoaib Akhter</div>
          <div style="font-size:11px; color:#eab308; font-weight:600;">STUDENT</div>
        </div>
      </div>

      <nav>
        <a href="studenton.html" class="nav-link">📁 Files</a>
        <a href="studenton.html" class="nav-link">🗂️ Folders</a>
        <a href="quiz.html" class="nav-link active">❓ Quiz</a>
      </nav>
    </div>

    <a href="nitrence.html" style="color: #ec4899; text-decoration: none; font-size: 13px; font-weight: 600; padding: 10px;">Sign out</a>
  </aside>

  <!-- Quiz Player Area -->
  <main class="content">
    <h1 id="quizTitle" style="font-size: 26px;">Classroom MCQ Test</h1>
    <p style="color:var(--muted); font-size:14px; margin-top:4px;">Test your knowledge on uploaded questions</p>

    <!-- Question View -->
    <div class="quiz-card" id="quizCard">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:13px; color:var(--accent-light);">
        <span id="questionNum">Question 1</span>
      </div>
      <h2 id="questionText" style="font-size:18px; margin-bottom:10px;">Loading questions...</h2>
      <div class="options-list" id="options"></div>
      <button class="primary-btn" id="nextBtn" disabled onclick="nextQuestion()">Next Question</button>
    </div>

    <!-- Results View -->
    <div class="quiz-card" id="resultCard" style="display:none; text-align:center; padding:40px;">
      <h2>Quiz Completed! 🎉</h2>
      <div id="finalScore" style="font-size:48px; font-weight:800; color:var(--accent-light); margin:20px 0;">0 / 0</div>
      <button class="primary-btn" onclick="location.reload()">Retake Quiz</button>
    </div>
  </main>

  <script>
    // Load questions uploaded from adminin.html
    const stored = localStorage.getItem("classroom_quiz_questions");
    const defaultQuestions = [
      { question: "Sample: What is the capital of Uttar Pradesh?", options: ["Kanpur", "Lucknow", "Varanasi", "Prayagraj"], answer: 1 }
    ];

    const questions = stored ? JSON.parse(stored) : defaultQuestions;
    const title = localStorage.getItem("quiz_title");
    if (title) document.getElementById('quizTitle').innerText = title;

    let idx = 0;
    let score = 0;

    function renderQuestion() {
      const q = questions[idx];
      document.getElementById('questionNum').innerText = `Question ${idx + 1} of ${questions.length}`;
      document.getElementById('questionText').innerText = q.question;
      const optContainer = document.getElementById('options');
      optContainer.innerHTML = '';
      document.getElementById('nextBtn').disabled = true;

      q.options.forEach((opt, oIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${String.fromCharCode(65 + oIdx)}) ${opt}`;
        btn.onclick = () => selectAnswer(oIdx, btn, q.answer);
        optContainer.appendChild(btn);
      });
    }

    function selectAnswer(chosenIdx, clickedBtn, correctIdx) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach((b, i) => {
        b.disabled = true;
        if (i === correctIdx) b.classList.add('correct');
      });

      if (chosenIdx === correctIdx) {
        score++;
      } else {
        clickedBtn.classList.add('wrong');
      }
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      idx++;
      if (idx < questions.length) {
        renderQuestion();
      } else {
        document.getElementById('quizCard').style.display = 'none';
        document.getElementById('resultCard').style.display = 'block';
        document.getElementById('finalScore').innerText = `${score} / ${questions.length}`;
      }
    }

    renderQuestion();
  </script>
</body>
</html>
