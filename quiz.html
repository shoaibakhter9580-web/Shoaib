<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Portal — Shoaib Akhter</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%), url('image_9a617e.jpg') no-repeat center center fixed; 
            background-size: cover; background-blend-mode: overlay;
            color: #1e293b; margin: 0; padding: 20px; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .container { 
            width: 100%; max-width: 650px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid rgba(255, 255, 255, 0.2); 
        }
        h1 { text-align: center; color: #312e81; margin-bottom: 20px; font-size: 1.5rem; }
        .select-box { margin-bottom: 20px; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 600; font-size: 0.95rem; background: #f8fafc; cursor: pointer; }
        .question-card { display: none; background: #fbfbfc; border: 1px solid #e2e8f0; padding: 22px; border-radius: 12px; margin-bottom: 20px; }
        .question-card.active { display: block; }
        .question-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: #0f172a; }
        .options-list label { display: block; padding: 12px 14px; margin: 8px 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .options-list input { margin-right: 10px; }
        label.correct-choice { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; font-weight: bold; }
        label.incorrect-choice { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; font-weight: bold; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
        button.nav-btn { background-color: #551a8b; color: white; border: none; padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; }
        #result-container { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 20px; background: #f8fafc; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Online Quiz Portal</h1>

    <div class="select-box" id="selectBoxContainer">
        <label for="quizDropdown" id="quizSyncLabel" style="font-size: 0.85rem; font-weight: bold; color: #475569; display: block; margin-bottom: 5px;">Syncing Quizzes from Telegram Cloud...</label>
        <select id="quizDropdown" onchange="loadChosenQuiz()">
            <option value="">-- Choose Uploaded Quiz --</option>
        </select>
    </div>

    <div id="quiz-container"></div>

    <div class="nav-buttons" id="controls" style="display:none;">
        <button class="nav-btn" onclick="prevQuestion()">Previous</button>
        <button class="nav-btn" style="background:#64748b;" onclick="skipQuestion()">Skip</button>
        <button class="nav-btn" onclick="nextQuestion()">Next</button>
    </div>

    <div id="result-container" style="display:none;"></div>
</div>

<script src="database.html"></script>
<script>
    const BOT_TOKEN = window.TG_DB_CONFIG.BOT_TOKEN;
    const ADMIN_CHAT_ID = window.TG_DB_CONFIG.ADMIN_CHAT_ID;

    let allCloudQuizzes = [];
    let activeQuizQuestions = [];
    let activeQuizPenalty = 0.5;
    let currentIndex = 0;
    let userAnswers = {};

    async function tgApiCall(method) {
        const directUrl = `https://api.telegram.org/bot${BOT_TOKEN}/${method}`;
        const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(directUrl)}`;
        try {
            const res = await fetch(directUrl);
            if (res.ok) return await res.json();
        } catch (e) {}
        try {
            const res2 = await fetch(proxyUrl);
            if (res2.ok) return await res2.json();
        } catch (e) {}
        return null;
    }

    async function tgDownloadFileText(filePath) {
        const directUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${filePath}?t=${Date.now()}`;
        const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(directUrl)}`;
        try {
            const res = await fetch(directUrl);
            if (res.ok) return await res.text();
        } catch (e) {}
        try {
            const res2 = await fetch(proxyUrl);
            if (res2.ok) return await res2.text();
        } catch (e) {}
        return null;
    }

    window.onload = async function() {
        await populateQuizSelector();
    };

    async function populateQuizSelector() {
        const label = document.getElementById("quizSyncLabel");
        try {
            const chatRes = await tgApiCall(`getChat?chat_id=${ADMIN_CHAT_ID}`);
            if (chatRes && chatRes.ok && chatRes.result && chatRes.result.pinned_message && chatRes.result.pinned_message.document) {
                const doc = chatRes.result.pinned_message.document;
                const fileRes = await tgApiCall(`getFile?file_id=${doc.file_id}`);
                if (fileRes && fileRes.ok && fileRes.result && fileRes.result.file_path) {
                    const rawJson = await tgDownloadFileText(fileRes.result.file_path);
                    if (rawJson) {
                        const parsed = JSON.parse(rawJson);
                        if (Array.isArray(parsed.quizzes)) {
                            allCloudQuizzes = parsed.quizzes;
                            localStorage.setItem("shoaib_all_quizzes", JSON.stringify(allCloudQuizzes));
                        }
                    }
                }
            }
        } catch (e) {}

        if (allCloudQuizzes.length === 0) {
            allCloudQuizzes = JSON.parse(localStorage.getItem("shoaib_all_quizzes") || "[]");
        }

        allCloudQuizzes.sort((a, b) => new Date(b.id || 0) - new Date(a.id || 0));
        if (label) label.textContent = "Select Quiz to Attempt:";

        const dropdown = document.getElementById("quizDropdown");
        dropdown.innerHTML = '<option value="">-- Choose Uploaded Quiz --</option>';
        allCloudQuizzes.forEach((quiz, index) => {
            let opt = document.createElement("option");
            opt.value = index;
            opt.textContent = quiz.name;
            dropdown.appendChild(opt);
        });
    }

    window.loadChosenQuiz = function() {
        const index = document.getElementById("quizDropdown").value;
        if (index === "") {
            document.getElementById("quiz-container").innerHTML = "";
            document.getElementById("controls").style.display = "none";
            document.getElementById("result-container").style.display = "none";
            document.getElementById("selectBoxContainer").style.display = "block";
            return;
        }

        document.getElementById("selectBoxContainer").style.display = "none";
        const selectedQuiz = allCloudQuizzes[index];
        activeQuizQuestions = selectedQuiz.questions;
        activeQuizPenalty = selectedQuiz.negativeMarking !== undefined ? parseFloat(selectedQuiz.negativeMarking) : 0.5;

        currentIndex = 0;
        userAnswers = {};
        document.getElementById("result-container").style.display = "none";

        if (activeQuizQuestions.length > 0) {
            document.getElementById("controls").style.display = "flex";
            renderQuestion();
        }
    };

    function renderQuestion() {
        if (currentIndex >= activeQuizQuestions.length) {
            showResults();
            return;
        }

        const q = activeQuizQuestions[currentIndex];
        let html = `<div class="question-card active"><div class="question-title">Question ${currentIndex + 1} of ${activeQuizQuestions.length}: ${q.question}</div><div class="options-list">`;

        q.options.forEach((optText, oIdx) => {
            let isAnswered = userAnswers[currentIndex] !== undefined;
            let checkedAttr = (userAnswers[currentIndex] === oIdx) ? 'checked' : '';
            let extraClass = '';
            if (isAnswered) {
                if (oIdx === q.answer) extraClass = 'correct-choice';
                else if (userAnswers[currentIndex] === oIdx) extraClass = 'incorrect-choice';
            }
            html += `<label class="${extraClass}"><input type="radio" name="q_current" value="${oIdx}" ${checkedAttr} ${isAnswered ? 'disabled' : ''} onclick="selectAnswer(${oIdx})">${String.fromCharCode(65 + oIdx)}) ${optText}</label>`;
        });

        html += `</div></div>`;
        document.getElementById("quiz-container").innerHTML = html;
    }

    window.selectAnswer = function(selectedIdx) {
        if (userAnswers[currentIndex] !== undefined) return;
        userAnswers[currentIndex] = selectedIdx;
        const q = activeQuizQuestions[currentIndex];
        const labels = document.querySelectorAll('.options-list label');

        labels.forEach((label, idx) => {
            label.querySelector('input').disabled = true;
            if (idx === q.answer) label.classList.add('correct-choice');
            else if (idx === selectedIdx && selectedIdx !== q.answer) label.classList.add('incorrect-choice');
        });

        setTimeout(() => { currentIndex++; renderQuestion(); }, 1100);
    };

    window.nextQuestion = function() { currentIndex++; renderQuestion(); };
    window.prevQuestion = function() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } };
    window.skipQuestion = function() { if (userAnswers[currentIndex] === undefined) userAnswers[currentIndex] = null; currentIndex++; renderQuestion(); };

    function showResults() {
        document.getElementById("quiz-container").innerHTML = "";
        document.getElementById("controls").style.display = "none";
        document.getElementById("selectBoxContainer").style.display = "block";

        let correctCount = 0, incorrectCount = 0, skippedCount = 0;
        activeQuizQuestions.forEach((q, idx) => {
            let ans = userAnswers[idx];
            if (ans === q.answer) correctCount++;
            else if (ans === null || ans === undefined) skippedCount++;
            else incorrectCount++;
        });

        const finalScore = (correctCount * 1) - (incorrectCount * activeQuizPenalty);
        const resDiv = document.getElementById("result-container");
        resDiv.style.display = "block";
        resDiv.innerHTML = `🎉 Quiz Completed Successfully!<br><br>Correct: <strong style="color: #10b981;">${correctCount}</strong> | Incorrect: <strong style="color: #ef4444;">${incorrectCount}</strong><br><br>Final Score: <span style="color: #551a8b; font-size: 1.4rem;">${finalScore.toFixed(2)}</span> / ${activeQuizQuestions.length}<br><br><button class="nav-btn" onclick="loadChosenQuiz()">Retake Quiz</button>`;
    }
</script>

</body>
</html>
