<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Portal — Shoaib Akhter</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f5f9; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .container { width: 100%; max-width: 650px; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        h1 { text-align: center; color: #312e81; margin-bottom: 20px; font-size: 1.5rem; }
        .select-box { margin-bottom: 20px; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 600; font-size: 0.95rem; background: #f8fafc; }
        .question-card { display: none; background: #fbfbfc; border: 1px solid #e2e8f0; padding: 22px; border-radius: 12px; margin-bottom: 20px; }
        .question-card.active { display: block; }
        .question-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: #0f172a; }
        .options-list label { display: block; padding: 12px 14px; margin: 8px 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        .options-list label:hover { background: #f1f5f9; border-color: #94a3b8; }
        .options-list input { margin-right: 10px; }
        label.correct-choice { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; font-weight: bold; }
        label.incorrect-choice { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; font-weight: bold; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
        button.nav-btn { background-color: #551a8b; color: white; border: none; padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        button.nav-btn:hover { background-color: #44136e; }
        button.skip-btn { background-color: #64748b; }
        button.skip-btn:hover { background-color: #475569; }
        #result-container { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 20px; background: #f8fafc; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Online Quiz Portal</h1>

    <div class="select-box">
        <label for="quizDropdown" style="font-size: 0.85rem; font-weight: bold; color: #475569; display: block; margin-bottom: 5px;">Select Quiz to Attempt:</label>
        <select id="quizDropdown" onchange="loadChosenQuiz()">
            <option value="">-- Choose Uploaded Quiz --</option>
        </select>
    </div>

    <div id="quiz-container"></div>

    <div class="nav-buttons" id="controls" style="display:none;">
        <button class="nav-btn" onclick="prevQuestion()">Previous</button>
        <button class="nav-btn skip-btn" onclick="skipQuestion()">Skip</button>
        <button class="nav-btn" onclick="nextQuestion()">Next</button>
    </div>

    <div id="result-container" style="display:none;"></div>
</div>

<script>
    let activeQuizQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};

    window.onload = function() {
        populateQuizSelector();
    };

    function populateQuizSelector() {
        let quizzes = JSON.parse(localStorage.getItem("shoaib_all_quizzes") || "[]");
        const dropdown = document.getElementById("quizDropdown");
        dropdown.innerHTML = '<option value="">-- Choose Uploaded Quiz --</option>';

        quizzes.forEach((quiz, index) => {
            let opt = document.createElement("option");
            opt.value = index;
            opt.textContent = quiz.name;
            dropdown.appendChild(opt);
        });
    }

    function loadChosenQuiz() {
        const index = document.getElementById("quizDropdown").value;
        if (index === "") {
            document.getElementById("quiz-container").innerHTML = "";
            document.getElementById("controls").style.display = "none";
            document.getElementById("result-container").style.display = "none";
            return;
        }

        let quizzes = JSON.parse(localStorage.getItem("shoaib_all_quizzes") || "[]");
        activeQuizQuestions = quizzes[index].questions;
        currentIndex = 0;
        userAnswers = {};
        document.getElementById("result-container").style.display = "none";

        if (activeQuizQuestions.length > 0) {
            document.getElementById("controls").style.display = "flex";
            renderQuestion();
        }
    }

    function renderQuestion() {
        const container = document.getElementById("quiz-container");
        if (currentIndex >= activeQuizQuestions.length) {
            showResults();
            return;
        }

        const q = activeQuizQuestions[currentIndex];
        let html = `
            <div class="question-card active">
                <div class="question-title">Question ${currentIndex + 1} of ${activeQuizQuestions.length}: ${q.question}</div>
                <div class="options-list">
        `;

        q.options.forEach((optText, oIdx) => {
            let isAnswered = userAnswers[currentIndex] !== undefined;
            let checkedAttr = (userAnswers[currentIndex] === oIdx) ? 'checked' : '';
            let extraClass = '';

            if (isAnswered) {
                if (oIdx === q.answer) {
                    extraClass = 'correct-choice';
                } else if (userAnswers[currentIndex] === oIdx) {
                    extraClass = 'incorrect-choice';
                }
            }

            html += `
                <label class="${extraClass}">
                    <input type="radio" name="q_current" value="${oIdx}" ${checkedAttr} ${isAnswered ? 'disabled' : ''} onclick="selectAnswer(${oIdx})">
                    ${String.fromCharCode(65 + oIdx)}) ${optText}
                </label>
            `;
        });

        html += `</div></div>`;
        container.innerHTML = html;
    }

    function selectAnswer(selectedIdx) {
        if (userAnswers[currentIndex] !== undefined) return;
        userAnswers[currentIndex] = selectedIdx;

        const q = activeQuizQuestions[currentIndex];
        const labels = document.querySelectorAll('.options-list label');

        labels.forEach((label, idx) => {
            const input = label.querySelector('input');
            input.disabled = true;
            if (idx === q.answer) {
                label.classList.add('correct-choice');
            } else if (idx === selectedIdx && selectedIdx !== q.answer) {
                label.classList.add('incorrect-choice');
            }
        });

        setTimeout(() => {
            currentIndex++;
            renderQuestion();
        }, 1100);
    }

    function nextQuestion() {
        currentIndex++;
        renderQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function skipQuestion() {
        if (userAnswers[currentIndex] === undefined) {
            userAnswers[currentIndex] = null;
        }
        currentIndex++;
        renderQuestion();
    }

    function showResults() {
        document.getElementById("quiz-container").innerHTML = "";
        document.getElementById("controls").style.display = "none";

        let correctCount = 0;
        let incorrectCount = 0;
        let skippedCount = 0;

        activeQuizQuestions.forEach((q, idx) => {
            let ans = userAnswers[idx];
            if (ans === q.answer) {
                correctCount++;
            } else if (ans === null || ans === undefined) {
                skippedCount++;
            } else {
                incorrectCount++;
            }
        });

        const penalty = parseFloat(localStorage.getItem("shoaib_negative_marking") || "0.5");
        let finalScore = (correctCount * 1) - (incorrectCount * penalty);

        const resDiv = document.getElementById("result-container");
        resDiv.style.display = "block";
        resDiv.innerHTML = `
            🎉 Quiz Completed Successfully!<br><br>
            <div style="font-size: 0.95rem; font-weight: normal; color: #475569; line-height: 1.6;">
                Correct: <strong style="color: #10b981;">${correctCount}</strong> | 
                Incorrect: <strong style="color: #ef4444;">${incorrectCount}</strong> | 
                Skipped: <strong>${skippedCount}</strong><br>
                Negative Penalty Rate: <strong>-${penalty}</strong>
            </div>
            <br>
            Final Calculated Score: <span style="color: #551a8b; font-size: 1.4rem;">${finalScore.toFixed(2)}</span> / ${activeQuizQuestions.length}
            <br><br>
            <button class="nav-btn" onclick="loadChosenQuiz()">Retake Quiz</button>
        `;
    }
</script>

</body>
</html>
