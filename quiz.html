<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz App - Gemini 3.5 Flash-Lite</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .admin-box {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
        }
        .admin-box textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        .admin-box button {
            margin-top: 8px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .admin-box button:hover {
            background-color: #0284c7;
        }
        .question-card {
            display: none;
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .question-card.active {
            display: block;
        }
        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #24292e;
        }
        .options-list label {
            display: block;
            padding: 10px 14px;
            margin: 8px 0;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }
        .options-list label:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        .options-list input {
            margin-right: 10px;
        }
        /* Color states for right/wrong answers */
        label.correct-choice {
            background-color: #dcfce7 !important;
            border-color: #16a34a !important;
            color: #15803d;
            font-weight: bold;
        }
        label.incorrect-choice {
            background-color: #fee2e2 !important;
            border-color: #dc2626 !important;
            color: #b91c1c;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        button.nav-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.nav-btn:hover {
            background-color: #1d4ed8;
        }
        button.skip-btn {
            background-color: #64748b;
        }
        button.skip-btn:hover {
            background-color: #475569;
        }
        #result-container {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gemini 3.5 Flash-Lite AI Quiz</h1>

    <!-- Admin Panel to load custom raw text/PDF questions with '@' -->
    <div class="admin-box">
        <label for="rawInput" style="font-size: 0.85rem; font-weight: bold; color: #475569; display: block; margin-bottom: 5px;">Admin: Paste Quiz Text (Supports '@' anywhere on correct option line)</label>
        <textarea id="rawInput">1. What is the capital of India?
A. Mumbai
B. Kolkata
C. New Delhi @
D. Chennai

2. Which river is the longest in India?
A. Yamuna
B. Ganga @
C. Brahmaputra
D. Godavari</textarea>
        <button onclick="loadQuizData()">Load / Refresh Quiz via Gemini Engine</button>
    </div>

    <div id="quiz-container"></div>

    <div class="nav-buttons" id="controls" style="display:none;">
        <button class="nav-btn" onclick="prevQuestion()">Previous</button>
        <button class="nav-btn skip-btn" onclick="skipQuestion()">Skip</button>
        <button class="nav-btn" onclick="nextQuestion()">Next</button>
    </div>

    <div id="result-container"></div>
</div>

<script>
    let questions = [];
    let currentIndex = 0;
    let userAnswers = {};

    // Helper: Parses raw multiline text input using Gemini 3.5 Flash-Lite parsing logic rules
    function parseQuizText(text) {
        const blocks = text.trim().split(/\n\s*\n/);
        let parsed = [];

        blocks.forEach((block, idx) => {
            const lines = block.split('\n').map(l => l.trim()).filter(l => l);
            if (lines.length >= 2) {
                let qText = lines[0].replace(/^\d+[\.\)]\s*/, '');
                let options = [];
                let correctLetter = '';

                for (let i = 1; i < lines.length; i++) {
                    let line = lines[i];
                    // Check if '@' exists anywhere on this option line
                    let isCorrect = line.includes('@');
                    
                    // Extract option letter (e.g., A, B, C, D)
                    let matchLetter = line.match(/^([A-Da-d])[\.\)]/);
                    let letter = matchLetter ? matchLetter[1].toUpperCase() : String.fromCharCode(65 + (i - 1));

                    if (isCorrect) {
                        correctLetter = letter;
                        // Clean up '@' symbol for display view
                        line = line.replace('@', '').trim();
                    }

                    // Remove option prefix letter for clean display if desired, or keep it
                    options.push({ letter: letter, text: line, isCorrect: isCorrect });
                }

                if (options.length > 0) {
                    if (!correctLetter) correctLetter = options[0].letter; // Fallback default
                    parsed.push({
                        id: idx + 1,
                        question: qText,
                        options: options,
                        correct: correctLetter
                    });
                }
            }
        });
        return parsed;
    }

    function loadQuizData() {
        const rawText = document.getElementById('rawInput').value;
        questions = parseQuizText(rawText);
        currentIndex = 0;
        userAnswers = {};
        document.getElementById('result-container').innerHTML = '';
        
        if (questions.length > 0) {
            document.getElementById('controls').style.display = 'flex';
            renderQuestion();
        } else {
            document.getElementById('quiz-container').innerHTML = '<p style="text-align:center; color:red;">No valid questions detected. Check format.</p>';
            document.getElementById('controls').style.display = 'none';
        }
    }

    function renderQuestion() {
        const container = document.getElementById('quiz-container');
        if (currentIndex >= questions.length) {
            showResults();
            return;
        }

        const q = questions[currentIndex];
        let html = `
            <div class="question-card active">
                <div class="question-title">Question ${currentIndex + 1} of ${questions.length}: ${q.question}</div>
                <div class="options-list">
        `;

        q.options.forEach(opt => {
            let isAnswered = userAnswers[currentIndex] !== undefined;
            let checkedAttr = (userAnswers[currentIndex] === opt.letter) ? 'checked' : '';
            let extraClass = '';

            if (isAnswered) {
                if (opt.letter === q.correct) {
                    extraClass = 'correct-choice';
                } else if (userAnswers[currentIndex] === opt.letter) {
                    extraClass = 'incorrect-choice';
                }
            }

            html += `
                <label class="${extraClass}">
                    <input type="radio" name="q_${currentIndex}" value="${opt.letter}" ${checkedAttr} ${isAnswered ? 'disabled' : ''} onclick="selectAnswer('${opt.letter}')">
                    ${opt.text}
                </label>
            `;
        });

        html += `</div></div>`;
        container.innerHTML = html;
    }

    function selectAnswer(selectedLetter) {
        if (userAnswers[currentIndex] !== undefined) return; // Prevent changing after selection
        userAnswers[currentIndex] = selectedLetter;

        const q = questions[currentIndex];
        const labels = document.querySelectorAll('.options-list label');
        
        labels.forEach(label => {
            const input = label.querySelector('input');
            input.disabled = true;
            if (input.value === q.correct) {
                label.classList.add('correct-choice');
            } else if (input.value === selectedLetter && selectedLetter !== q.correct) {
                label.classList.add('incorrect-choice');
            }
        });

        // Automatically move to next question after 1.2 seconds delay
        setTimeout(() => {
            currentIndex++;
            renderQuestion();
        }, 1200);
    }

    function nextQuestion() {
        currentIndex++;
        renderQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function skipQuestion() {
        if (userAnswers[currentIndex] === undefined) {
            userAnswers[currentIndex] = null; // Marked as skipped
        }
        currentIndex++;
        renderQuestion();
    }

    function showResults() {
        document.getElementById('quiz-container').innerHTML = '';
        document.getElementById('controls').style.display = 'none';

        let score = 0;
        questions.forEach((q, idx) => {
            if (userAnswers[idx] === q.correct) score++;
        });

        document.getElementById('result-container').innerHTML = `
            🎉 Quiz Completed!<br>
            Your Score: <span style="color: #16a34a;">${score}</span> / ${questions.length}
            <br><br>
            <button class="nav-btn" onclick="loadQuizData()">Restart Quiz</button>
        `;
    }

    // Auto-load on startup
    window.onload = loadQuizData;
</script>

</body>
</html>
